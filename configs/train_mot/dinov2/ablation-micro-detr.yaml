# Ablation: Micro Deformable DETR — 10 queries, 2 layers, FFN=512, no DN
# Trainable head ~1.5M. Minimal capacity to test if DN-DETR helps or hurts.
# Quick screening: 20 epochs, warmup 3.

meta:
  stage: stage1_supervised
  folder: outputs/mot/ablation-micro-detr
  name: ablation-micro-detr
  seed: 42
  dtype: bfloat16

data:
  dataset_type: MOTCholecDataset
  datasets:
    - data/cholectrack20
  clip_length: 3
  img_size: 392
  batch_size: 8
  num_workers: 6
  pin_memory: true

model:
  encoder_type: dinov2
  model_name: dinov2_vitb14
  encoder_dim: 768
  neck_dim: 256
  layer_indices: [-1]
  encoder_checkpoint: /scratch/kcwp264/checkpoints/surgenet_dino/DINOv2_ViTb14_size336_SurgeNetXL.pth
  use_torch_hub: true
  encoder_lora:
    enable: true
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: ['qkv', 'proj', 'fc1', 'fc2']
    start_block: 0
    end_block: null

predictor:
  dim: 256
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 2
  dim_feedforward: 1024
  dropout: 0.1

detr:
  use_deformable_detr: true
  num_tools: 7
  num_queries: 10
  num_decoder_layers: 2
  nheads: 8
  n_points: 4
  dim_feedforward: 512
  dropout: 0.2
  class_weight: 1.0
  bbox_weight: 5.0
  giou_weight: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  use_denoising: false
  num_denoising_groups: 1
  num_noise_per_group: 1
  label_noise_prob: 0.2
  box_noise_scale: 0.4
  denoising_weight: 1.0

reid:
  embedding_dim: 256
  supcon_weight: 1.0
  supcon_temperature: 0.07
  cross_consistency_weight: 0.0
  dropout: 0.15

tracker:
  birth_score: 0.6
  min_hits: 3
  max_age: 30
  reentry_ttl: 300
  cost_threshold: 0.7
  infer_score_threshold: 0.3

losses:
  detector_only: true
  track_weight: 0.0
  track_cls_weight: 1.0
  track_giou_weight: 1.0
  reid_weight: 0.0

stage_flags:
  use_geometry: false
  use_occusolver: false
  use_depth: false

optimization:
  lr: 2.0e-4
  lora_lr: 1.0e-4
  weight_decay: 1.0e-2
  epochs: 20
  min_lr: 1.0e-6
  warmup_epochs: 3
  gradient_clip_norm: 1.0
  log_freq: 10

wandb:
  enabled: true
  project: surgical-mot
  entity: null
  name: ablation-micro-detr
  group: ablation-stage1
  job_type: train
  tags: ["ablation", "micro", "no-dn", "stage1", "surgenet", "lora", "deformable", "3gpu"]
  watch: gradients
  watch_freq: 100
