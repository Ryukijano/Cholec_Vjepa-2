# Stage 3 — Joint MOT fine-tune with the GOT-JEPA pretrained student.
#
# Loads:
#   * Stage 1 checkpoint → neck, DETR, ReID, track manager.
#   * Stage 2 checkpoint → student per-track predictor (replaces Stage 1 one).
#
# Unfreezes: student predictor, DETR decoder, ReID head, neck.
# Keeps encoder frozen (toggle encoder LoRA later if desired).

meta:
  stage: stage3_joint
  folder: outputs/mot/cholec20-stage3-joint-finetune
  name: cholec20-mot-stage3-joint-finetune
  seed: 42
  dtype: bfloat16
  load_checkpoint: outputs/mot/cholec20-stage2-jepa-pretrain/best.pth.tar

data:
  dataset_type: MOTCholecDataset
  datasets:
    - data/cholectrack20
  clip_length: 3
  img_size: 392
  batch_size: 2
  num_workers: 4
  pin_memory: true

model:
  encoder_type: dinov2
  model_name: dinov2_vitb14
  encoder_dim: 768
  neck_dim: 256
  layer_indices: [-1]
  encoder_checkpoint: checkpoints/cholec20/supervised_detr_reid_base384/latest.pth.tar
  use_torch_hub: true

predictor:
  dim: 256
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 2
  dim_feedforward: 1024
  dropout: 0.1

detr:
  num_tools: 7
  num_queries: 16
  num_decoder_layers: 5
  nheads: 8
  dropout: 0.15
  class_weight: 1.0
  bbox_weight: 5.0
  giou_weight: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0

reid:
  embedding_dim: 256
  supcon_weight: 1.0
  supcon_temperature: 0.07
  cross_consistency_weight: 0.0
  dropout: 0.15

tracker:
  birth_score: 0.6
  min_hits: 3
  max_age: 30
  reentry_ttl: 300
  cost_threshold: 0.7

losses:
  track_weight: 1.0
  track_cls_weight: 1.0
  track_giou_weight: 2.0
  reid_weight: 0.5

stage_flags:
  use_geometry: false
  use_occusolver: false

optimization:
  lr: 5.0e-5              # lower than Stage 1 — fine-tuning
  weight_decay: 1.0e-2
  epochs: 10
  min_lr: 1.0e-7
  warmup_epochs: 1
  gradient_clip_norm: 1.0
  log_freq: 10
