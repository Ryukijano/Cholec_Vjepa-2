# Stage 2 — GOT-JEPA SSL on CholecTrack20 only (no Cholec80 pseudo-labels).
#
# Simpler alternative to the combined corpus: trains SSL on 10 CT20 training
# videos with real annotations only. Less data but no pseudo-label noise.
# Use this if the SSL corpus is not yet rebuilt.
#
# Usage (3x L40S interactive):
#   torchrun --standalone --nproc_per_node=3 \
#     -m core_app.mot.main \
#     --fname configs/train_mot/dinov2/cholec20-mot-stage2-jepa-surgenet.yaml \
#     --devices cuda

meta:
  stage: stage2_jepa
  folder: outputs/mot/cholec20-stage2-jepa-surgenet
  name: cholec20-mot-stage2-jepa-surgenet
  seed: 42
  dtype: bfloat16
  load_checkpoint: outputs/mot/cholec20-stage1-surgenet/best.pth.tar

data:
  dataset_type: MOTCholecDataset
  per_track_min_visible_frames: 3   # real annotations — require full visibility
  datasets:
    - /scratch/kcwp264/datasets_cholec/cholectrack20
  clip_length: 3
  img_size: 392
  batch_size: 6           # per-GPU; ViT-B double forward
  num_workers: 8
  pin_memory: true

model:
  encoder_type: dinov2
  model_name: dinov2_vitb14
  encoder_dim: 768
  neck_dim: 256
  layer_indices: [-1]
  encoder_checkpoint: /scratch/kcwp264/checkpoints/surgenet_dino/DINOv2_ViTb14_size336_SurgeNetXL.pth
  use_torch_hub: true
  encoder_lora:
    enable: true
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: ['qkv', 'proj', 'fc1', 'fc2']
    start_block: 0
    end_block: null

predictor:
  dim: 256
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 2
  dim_feedforward: 1024
  dropout: 0.1

detr:
  use_deformable_detr: true
  num_tools: 7
  num_queries: 48
  num_decoder_layers: 6
  nheads: 8
  n_points: 4
  dropout: 0.1
  class_weight: 1.0
  bbox_weight: 5.0
  giou_weight: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  use_denoising: true
  num_denoising_groups: 2
  num_noise_per_group: 2
  label_noise_prob: 0.2
  box_noise_scale: 0.4
  denoising_weight: 1.0

reid:
  embedding_dim: 256
  supcon_weight: 1.0
  supcon_temperature: 0.07
  cross_consistency_weight: 0.0
  dropout: 0.15

tracker:
  birth_score: 0.6
  min_hits: 3
  max_age: 30
  reentry_ttl: 300
  cost_threshold: 0.7
  infer_score_threshold: 0.3

augmentation:
  smoke_p: 0.4
  blood_p: 0.2
  spec_p: 0.3
  blur_p: 0.3
  jitter_p: 0.5
  cutout_p: 0.2

losses:
  jepa_inv_weight: 1.0
  jepa_cov_weight: 0.5
  jepa_reg_mode: visreg
  jepa_visreg_num_slices: 64
  jepa_visreg_scale_weight: 1.0
  jepa_visreg_shape_weight: 1.0
  jepa_visreg_center_weight: 1.0

stage_flags:
  use_geometry: false
  use_occusolver: false

optimization:
  lr: 5.0e-4
  weight_decay: 1.0e-2
  epochs: 50
  min_lr: 1.0e-6
  warmup_epochs: 1
  gradient_clip_norm: 1.0
  log_freq: 20

wandb:
  enabled: true
  project: surgical-mot
  entity: null
  name: stage2-jepa-surgenet-ct20-3gpu
  group: cholec20-ssl-surgenet
  job_type: train
  tags: ["stage2", "ssl", "cholec20", "surgenet", "vitb14", "3gpu", "l40s"]
  watch: gradients
  watch_freq: 100
