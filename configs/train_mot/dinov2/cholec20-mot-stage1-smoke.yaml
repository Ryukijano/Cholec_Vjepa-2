# Short smoke test — same as stage1-supervised but 2 epochs (use with --debugmode True).
meta:
  stage: stage1_supervised
  folder: outputs/mot/cholec20-stage1-supervised-smoke
  name: cholec20-mot-stage1-smoke
  seed: 42
  dtype: bfloat16

data:
  dataset_type: MOTCholecDataset
  datasets:
    - data/cholectrack20
  clip_length: 3
  img_size: 392
  batch_size: 24
  num_workers: 8
  pin_memory: true

model:
  encoder_type: dinov2
  model_name: dinov2_vits14
  encoder_dim: 384
  neck_dim: 256
  layer_indices: [-1]
  encoder_checkpoint: null
  use_torch_hub: true

predictor:
  dim: 256
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 2
  dim_feedforward: 1024
  dropout: 0.1

detr:
  use_deformable_detr: true
  num_tools: 7
  num_queries: 16
  num_decoder_layers: 6
  nheads: 8
  n_points: 4
  dropout: 0.1
  class_weight: 1.0
  bbox_weight: 5.0
  giou_weight: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0

reid:
  embedding_dim: 256
  supcon_weight: 1.0
  supcon_temperature: 0.07
  cross_consistency_weight: 0.0
  dropout: 0.15

tracker:
  birth_score: 0.6
  min_hits: 3
  max_age: 30
  reentry_ttl: 300
  cost_threshold: 0.7
  infer_score_threshold: 0.5

losses:
  track_weight: 1.0
  track_cls_weight: 1.0
  track_giou_weight: 2.0
  reid_weight: 0.5

stage_flags:
  use_geometry: false
  use_occusolver: false
  use_depth: false

optimization:
  lr: 2.0e-4
  weight_decay: 1.0e-2
  epochs: 2
  min_lr: 1.0e-6
  warmup_epochs: 1
  gradient_clip_norm: 1.0
  log_freq: 1

wandb:
  enabled: true
  project: surgical-mot
  name: stage1-smoke-gb10
  tags: ["stage1", "smoke", "gb10"]
  watch: null
