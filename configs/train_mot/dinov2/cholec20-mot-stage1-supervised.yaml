# Stage 1 — DETR teacher on CholecTrack20 (supervised boxes).
#
# Primary goal: a detector that emits usable pseudo-labels on Cholec80 for Stage 2.
# Track/ReID branches stay in the graph but are off when losses.detector_only=true.
# Tune tracker.infer_score_threshold + build_ssl_corpus --score_threshold for recall.

meta:
  stage: stage1_supervised
  folder: outputs/mot/cholec20-stage1-supervised
  name: cholec20-mot-stage1-supervised
  seed: 42
  dtype: bfloat16       # trainer AMP: autocast bf16 forward (preferred on GB10); use float16 for fp16

data:
  dataset_type: MOTCholecDataset
  # Default repo layout: Gyanateet_tracking/data/cholectrack20/{Training,Validation}/...
  # Override for clusters: MOT_DATA_ROOT=/path/to/cholectrack20
  datasets:
    - data/cholectrack20
  clip_length: 3          # ref_0, ref_1, current
  img_size: 392           # DINOv2 patch 14 → 28x28 feature grid
  batch_size: 24          # lowered after epoch-63 track NaNs; raise to 32 when stable
  num_workers: 8
  pin_memory: true

model:
  encoder_type: dinov2
  model_name: dinov2_vits14
  encoder_dim: 384
  neck_dim: 256  # stays 256 after projection neck
  layer_indices: [-1]
  encoder_checkpoint: null     # start fresh — incompatible checkpoint found
  use_torch_hub: true

predictor:
  dim: 256                # per-track predictor working dimension
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 2
  dim_feedforward: 1024
  dropout: 0.1

detr:
  use_deformable_detr: true   # deformable cross-attn (strong spatial prior, no query collapse)
  num_tools: 7
  num_queries: 16
  num_decoder_layers: 6      # Deformable DETR works well with 6 layers
  nheads: 8
  n_points: 4                 # sampling points per head per level
  dropout: 0.1               # slightly lower dropout for faster convergence
  class_weight: 1.0
  bbox_weight: 5.0
  giou_weight: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0

reid:
  embedding_dim: 256
  supcon_weight: 1.0      # supervised contrastive ON for identity learning
  supcon_temperature: 0.07
  cross_consistency_weight: 0.0  # no phantom features in Stage 1
  dropout: 0.15

tracker:
  birth_score: 0.6
  min_hits: 3
  max_age: 30
  reentry_ttl: 300
  cost_threshold: 0.7
  infer_score_threshold: 0.3   # pseudo-label recall; SSL build uses --score_threshold separately

losses:
  detector_only: true     # train DETR only — pseudo-label teacher, not full MOT
  track_weight: 0.0       # ignored when detector_only
  track_cls_weight: 1.0
  track_giou_weight: 1.0
  reid_weight: 0.0        # ignored when detector_only

stage_flags:
  use_geometry: false     # Stage 4 only
  use_occusolver: false   # Stage 4 only
  use_depth: false        # Stage 4 only

optimization:
  lr: 1.0e-4              # lowered after epoch-63 divergence; was 2e-4
  weight_decay: 1.0e-2
  epochs: 100             # DETR needs many epochs to converge; queries must specialise
  min_lr: 1.0e-6
  warmup_epochs: 5        # long warmup prevents early instability of decoder queries
  gradient_clip_norm: 1.0
  log_freq: 10

wandb:
  enabled: true
  project: surgical-mot
  entity: null
  name: stage1-supervised-gb10-1gpu
  group: cholec20-stage1
  job_type: train
  tags: ["stage1", "supervised", "gb10", "1gpu"]
  watch: gradients
  watch_freq: 100
