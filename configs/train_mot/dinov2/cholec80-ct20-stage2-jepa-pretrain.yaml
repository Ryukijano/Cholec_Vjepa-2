# =============================================================================
# Stage 2 — GOT-JEPA SSL predictor pretraining on leak-free Cholec80 + CT20.
# =============================================================================
#
# Prerequisites:
#   1. Stage 1 supervised checkpoint at ``meta.load_checkpoint``.
#   2. Unified SSL corpus built by:
#        python -m scripts.build_ssl_corpus \
#          --stage1_config configs/train_mot/dinov2/cholec20-mot-stage1-supervised.yaml \
#          --stage1_checkpoint outputs/mot/cholec20-stage1-supervised/best.pth.tar \
#          --out_root data/ssl_corpus
#
# Corpus composition (75 videos, leak-free w.r.t. CT20 val/test):
#   - 10 CT20 Training videos (VID02..VID103) with REAL annotations.
#   - 73 Cholec80 videos (minus video01, 06, 07, 12, 25, 30, 39) with PSEUDO
#     annotations generated by the Stage 1 detector + TrackManager.
#
# Trainable: student per-track predictor + ProjNet + Expander.
# Frozen:    DINOv2 encoder, neck, DETR head, ReID head, teacher predictor.
#
# Backbone: DINOv2 ViT-S/14 (dinov2_vits14, dim=384) — MUST match Stage 1 checkpoint.
# =============================================================================

meta:
  stage: stage2_jepa
  folder: outputs/mot/cholec80-ct20-stage2-jepa-pretrain
  name: cholec80-ct20-stage2-jepa-pretrain
  seed: 42
  dtype: bfloat16
  # Teacher predictor and frozen heads are initialised from this checkpoint.
  load_checkpoint: outputs/mot/cholec20-stage1-supervised/best.pth.tar

data:
  dataset_type: MOTCholecDataset
  per_track_min_visible_frames: 1   # pseudo-labels are sparse; fill refs from cur frame
  datasets:
    # Unified layout built by scripts/build_ssl_corpus.py. Mirrors CT20
    # structure so MOTCholecDataset reads both real + pseudo annotations.
    - data/ssl_corpus
  clip_length: 3
  img_size: 392
  batch_size: 16         # GB10 DGX Spark: 2× frozen ViT-S encode/step; try 24 if stable
  num_workers: 10        # Grace CPUs — JPEG decode parallelism
  pin_memory: true

model:
  encoder_type: dinov2
  model_name: dinov2_vits14   # ViT-S — same as Stage 1 (NOT vitb14)
  encoder_dim: 384
  neck_dim: 256
  layer_indices: [-1]
  use_torch_hub: true

predictor:
  dim: 256
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 2
  dim_feedforward: 1024
  dropout: 0.1

# DETR / ReID / tracker are loaded from the Stage 1 checkpoint for teacher
# features but are frozen throughout Stage 2. These fields mirror Stage 1
# so build_model_from_config reconstructs an identical architecture.
detr:
  use_deformable_detr: true   # must match Stage 1 architecture for checkpoint load
  num_tools: 7
  num_queries: 16
  num_decoder_layers: 6
  nheads: 8
  n_points: 4
reid:
  embedding_dim: 256
tracker:
  birth_score: 0.6

augmentation:
  # SurgicalCorruption — applied ONLY to the student's current frame.
  # Values slightly higher than Stage 1 because pseudo-labels provide weaker
  # supervision; stronger corruption forces invariance learning.
  smoke_p: 0.45
  blood_p: 0.25
  spec_p:  0.35
  blur_p:  0.35
  jitter_p: 0.5
  cutout_p: 0.25

losses:
  jepa_inv_weight: 25.0   # α — GOT-JEPA paper best ratio (invariance dominates)
  jepa_cov_weight: 1.0    # β — VICReg-style covariance regularizer (not dominant)

stage_flags:
  use_geometry: false
  use_occusolver: true     # enable visibility-gated pseudo-labels

# OccuSolver configuration (CoTracker3 for visibility gating)
occusolver:
  cotracker_version: 3
  cotracker_mode: online
  num_query_points: 4
  num_refine_steps: 0
  use_depth: false
  freeze: true

optimization:
  lr: 5.0e-4
  weight_decay: 1.0e-2
  epochs: 30              # 75 videos × ~200 frames → ~15k clips → plenty
  min_lr: 1.0e-6
  warmup_epochs: 1
  gradient_clip_norm: 1.0
  log_freq: 20

# ------------------------------------------------------------------
# W&B experiment tracking (optional — set enabled: false to disable)
# ------------------------------------------------------------------
wandb:
  enabled: true
  project: surgical-mot
  entity: null            # your wandb team / username
  name: cholec80-ct20-stage2-jepa-gb10
  group: cholec80-ssl
  job_type: train
  tags: ["stage2", "ssl", "cholec80"]
  watch: gradients        # log gradients + parameters histograms
  watch_freq: 100         # every N batches
