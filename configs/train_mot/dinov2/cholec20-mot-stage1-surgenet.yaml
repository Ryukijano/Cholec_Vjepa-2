# Stage 1 — SurgeNetDINO frozen encoder + LoRA-DETR detector on CholecTrack20.
#
# Uses SurgeNetDINO ViT-B/14 (domain-pretrained on 4.7M surgical frames)
# as a frozen backbone with LoRA adapters for light domain tuning.
# SurgeNetDINO linear probe: 70.9% on Cholec80 phase recognition vs 62.4% raw DINOv2.
#
# Usage (3x L40S interactive):
#   torchrun --standalone --nproc_per_node=3 \
#     -m core_app.mot.main \
#     --fname configs/train_mot/dinov2/cholec20-mot-stage1-surgenet.yaml \
#     --devices cuda

meta:
  stage: stage1_supervised
  folder: outputs/mot/cholec20-stage1-surgenet
  name: cholec20-mot-stage1-surgenet
  seed: 42
  dtype: bfloat16

data:
  dataset_type: MOTCholecDataset
  datasets:
    - data/cholectrack20
  clip_length: 3
  img_size: 336          # MUST match SurgeNetDINO checkpoint (336x336, 577 pos_embed tokens)
  batch_size: 12          # per-GPU; 12*2=24 effective batch on 2x L40S
  num_workers: 8           # 8 per process × 2 = 16 DataLoader workers
  pin_memory: true

model:
  encoder_type: dinov2
  model_name: dinov2_vitb14
  encoder_dim: 768
  neck_dim: 256
  layer_indices: [-1]
  # SurgeNetDINO: DINOv2 ViT-B/14 pretrained on SurgeNetXL surgical dataset
  encoder_checkpoint: /scratch/kcwp264/checkpoints/surgenet_dino/DINOv2_ViTb14_size336_SurgeNetXL.pth
  use_torch_hub: true
  # LoRA adapters on top of frozen SurgeNetDINO encoder
  encoder_lora:
    enable: true
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules: ['qkv', 'proj', 'fc1', 'fc2']
    start_block: 0          # LoRA on all blocks — encoder is frozen, only adapters train
    end_block: null

predictor:
  dim: 256
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 2
  dim_feedforward: 1024
  dropout: 0.1

detr:
  use_deformable_detr: true
  num_tools: 7
  num_queries: 48
  num_decoder_layers: 6
  nheads: 8
  n_points: 4
  dropout: 0.1
  class_weight: 1.0
  bbox_weight: 5.0
  giou_weight: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  # DN-DETR denoising for query stability
  use_denoising: true
  num_denoising_groups: 2
  num_noise_per_group: 2
  label_noise_prob: 0.2
  box_noise_scale: 0.4
  denoising_weight: 1.0

reid:
  embedding_dim: 256
  supcon_weight: 1.0
  supcon_temperature: 0.07
  cross_consistency_weight: 0.0
  dropout: 0.15

tracker:
  birth_score: 0.6
  min_hits: 3
  max_age: 30
  reentry_ttl: 300
  cost_threshold: 0.7
  infer_score_threshold: 0.3

losses:
  detector_only: true
  track_weight: 0.0
  track_cls_weight: 1.0
  track_giou_weight: 1.0
  reid_weight: 0.0

stage_flags:
  use_geometry: false
  use_occusolver: false
  use_depth: false

optimization:
  lr: 2.0e-4              # head LR (DETR, predictor, ReID, neck)
  lora_lr: 1.0e-4         # LoRA adapter LR
  weight_decay: 1.0e-2
  epochs: 200
  min_lr: 1.0e-6
  warmup_epochs: 5
  gradient_clip_norm: 1.0
  log_freq: 10

wandb:
  enabled: true
  project: surgical-mot
  entity: null
  name: stage1-surgenet-label-fix-2gpu
  group: cholec20-stage1-surgenet
  job_type: train
  tags: ["stage1", "surgenet", "lora", "deformable", "2gpu", "l40s"]
  watch: gradients
  watch_freq: 100
