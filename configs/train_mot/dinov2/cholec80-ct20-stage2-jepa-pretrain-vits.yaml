# Stage 2 (ViT-S) — alias / legacy output folder for ViT-S SSL runs.
#
# Canonical config: cholec80-ct20-stage2-jepa-pretrain.yaml (now ViT-S by default).
# Use this file only if you want outputs under ...-pretrain-vits/.

meta:
  stage: stage2_jepa
  folder: outputs/mot/cholec80-ct20-stage2-jepa-pretrain-vits
  name: cholec80-ct20-stage2-jepa-pretrain-vits
  seed: 42
  dtype: bfloat16
  load_checkpoint: outputs/mot/cholec20-stage1-supervised/best.pth.tar

data:
  dataset_type: MOTCholecDataset
  datasets:
    - data/ssl_corpus
  clip_length: 3
  img_size: 392
  batch_size: 6          # ViT-S is lighter, can push higher
  num_workers: 6
  pin_memory: true

model:
  encoder_type: dinov2
  model_name: dinov2_vits14
  encoder_dim: 384
  neck_dim: 256
  layer_indices: [-1]
  use_torch_hub: true

predictor:
  dim: 256
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 2
  dim_feedforward: 1024
  dropout: 0.1

detr:
  use_deformable_detr: true
  num_tools: 7
  num_queries: 16
  num_decoder_layers: 6
  nheads: 8
  n_points: 4
reid:
  embedding_dim: 256
tracker:
  birth_score: 0.6

augmentation:
  smoke_p: 0.45
  blood_p: 0.25
  spec_p:  0.35
  blur_p:  0.35
  jitter_p: 0.5
  cutout_p: 0.25

losses:
  jepa_inv_weight: 1.0
  jepa_cov_weight: 0.5

stage_flags:
  use_geometry: false
  use_occusolver: true

occusolver:
  cotracker_version: 3
  cotracker_mode: online
  num_query_points: 4
  num_refine_steps: 0
  use_depth: false
  freeze: true

optimization:
  lr: 5.0e-4
  weight_decay: 1.0e-2
  epochs: 30
  min_lr: 1.0e-6
  warmup_epochs: 1
  gradient_clip_norm: 1.0
  log_freq: 20

wandb:
  enabled: true
  project: surgical-mot
  entity: null
  name: stage2-jepa-vits
  group: cholec80-ssl
  job_type: train
  tags: ["stage2", "ssl", "cholec80", "vits"]
  watch: gradients
  watch_freq: 100
