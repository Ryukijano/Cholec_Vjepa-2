# Stage 4 Lean — CoTracker3 + Depth-Anything-V2-Small (no VGGT).
#
# This is the lightweight alternative to stage4-full. It replaces the
# ~300M VGGT geometry branch with Depth-Anything-V2-Small (~25M) inside
# OccuSolver, enabling batch_size=2 and real-time-viable throughput.
#
# Ablation: compare against stage4-full (use_geometry=true) to measure
# the cost/benefit of dense vs sparse geometry.

meta:
  stage: stage4_lean
  folder: outputs/mot/cholec20-stage4-lean-vits
  name: cholec20-mot-stage4-lean-vits
  seed: 42
  dtype: bfloat16
  load_checkpoint: outputs/mot/cholec20-stage3-joint-finetune-vits/best.pth.tar

data:
  dataset_type: MOTCholecDataset
  datasets:
    - data/cholectrack20
  clip_length: 3
  img_size: 392
  batch_size: 2           # Lean geometry allows larger batch
  num_workers: 4
  pin_memory: true

model:
  encoder_type: dinov2
  model_name: dinov2_vits14
  encoder_dim: 384
  neck_dim: 256
  layer_indices: [-1]
  use_torch_hub: true

predictor:
  dim: 256
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 2
  dim_feedforward: 1024
  dropout: 0.1

detr:
  num_tools: 7
  num_queries: 16
  num_decoder_layers: 5
  nheads: 8
  dropout: 0.15
  class_weight: 1.0
  bbox_weight: 5.0
  giou_weight: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0

reid:
  embedding_dim: 256
  supcon_weight: 1.0
  supcon_temperature: 0.07
  cross_consistency_weight: 0.1
  dropout: 0.15

tracker:
  birth_score: 0.6
  min_hits: 3
  max_age: 30
  reentry_ttl: 300
  cost_threshold: 0.7

losses:
  track_weight: 1.0
  track_cls_weight: 1.0
  track_giou_weight: 2.0
  reid_weight: 0.5
  occu_weight: 0.3
  consist_weight: 0.0           # no VGGT branch in lean path
  occu_gate_features: true
  occu_max_tracks_per_batch: 8

stage_flags:
  use_geometry: false      # Lean path — no VGGT
  use_occusolver: true

occusolver:
  stub: false
  cotracker_version: 3     # CoTracker3 for iterative refinement
  cotracker_mode: online
  num_refine_steps: 2
  num_query_points: 16
  use_depth: true
  depth_stub: true          # stub when HF Depth-Anything unavailable offline

optimization:
  lr: 1.0e-5
  weight_decay: 1.0e-2
  epochs: 10
  min_lr: 1.0e-8
  warmup_epochs: 2
  gradient_clip_norm: 1.0
  log_freq: 5
