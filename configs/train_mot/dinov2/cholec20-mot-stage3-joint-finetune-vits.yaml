# Stage 3 (ViT-S) — Joint MOT fine-tune with GOT-JEPA pretrained student.
#
# ViT-S variant matching Stage 1+2 checkpoints (dinov2_vits14, dim=384).
# Launch:
#   python -m core_app.mot.main --fname <this yaml> --devices cuda:0 \
#     --resume outputs/mot/cholec80-ct20-stage2-jepa-pretrain/latest.pth.tar \
#     --start-epoch 0 --reset-optimizer

meta:
  stage: stage3_joint
  folder: outputs/mot/cholec20-stage3-joint-finetune-vits
  name: cholec20-mot-stage3-joint-finetune-vits
  seed: 42
  dtype: bfloat16
  load_checkpoint: outputs/mot/cholec80-ct20-stage2-jepa-pretrain/latest.pth.tar

data:
  dataset_type: MOTCholecDataset
  datasets:
    - data/cholectrack20
  clip_length: 3
  img_size: 392
  batch_size: 4          # GB10: try 4; reduce to 2 if OOM
  num_workers: 8
  pin_memory: true

model:
  encoder_type: dinov2
  model_name: dinov2_vits14
  encoder_dim: 384
  neck_dim: 256
  layer_indices: [-1]
  use_torch_hub: true

predictor:
  dim: 256
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 2
  dim_feedforward: 1024
  dropout: 0.1

detr:
  use_deformable_detr: true   # must match Stage 1/2 for checkpoint load
  num_tools: 7
  num_queries: 16
  num_decoder_layers: 6
  nheads: 8
  n_points: 4
  dropout: 0.15
  class_weight: 1.0
  bbox_weight: 5.0
  giou_weight: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0

reid:
  embedding_dim: 256
  supcon_weight: 1.0
  supcon_temperature: 0.07
  cross_consistency_weight: 0.0
  dropout: 0.15

tracker:
  birth_score: 0.6
  min_hits: 3
  max_age: 30
  reentry_ttl: 300
  cost_threshold: 0.7

losses:
  track_weight: 1.0
  track_cls_weight: 1.0
  track_giou_weight: 2.0
  reid_weight: 0.5

stage_flags:
  use_geometry: false
  use_occusolver: false

optimization:
  lr: 5.0e-5
  weight_decay: 1.0e-2
  epochs: 10
  min_lr: 1.0e-7
  warmup_epochs: 1
  gradient_clip_norm: 1.0
  log_freq: 10

wandb:
  enabled: true
  project: surgical-mot
  entity: null
  name: cholec20-stage3-joint-vits-gb10
  group: cholec80-ssl
  job_type: train
  tags: ["stage3", "joint", "cholectrack20", "vits"]
  watch: parameters
  watch_freq: 100
